aid: medely
name: Medely
description: >-
  Medely is a healthcare workforce orchestration platform and staffing
  marketplace that connects healthcare facilities with a network of qualified
  nurses and allied health professionals. What began as a marketplace to match
  facilities with per-diem talent has grown into a full workforce management
  platform, helping hospitals, surgery centers, skilled nursing facilities, and
  other providers fill open and per-diem shifts, support their core clinical
  teams, and maintain high-quality patient care. Medely offers credentialing,
  scheduling, and flexible workforce management tools, and holds the Joint
  Commission's Gold Seal of Approval for its staffing services. The company is
  backed by General Catalyst and Wing Venture Capital. Medely does not currently
  operate a public developer program or documented API; its GraphQL backend at
  api.medely.com powers the first-party web and mobile applications only.
